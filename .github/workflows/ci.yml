name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Publish safety check (no GTM data in the repo)
        run: npm run check:safety

      - name: Build
        run: npm run build

      # test/extension/runTest.ts reads VSCODE_PATH (it defaults to the macOS app path),
      # so download a VS Code build first and point it there.
      - name: Download VS Code for the extension test
        if: runner.os == 'Linux'
        run: node -e "require('@vscode/test-electron').downloadAndUnzipVSCode('stable').then((p) => require('fs').appendFileSync(process.env.GITHUB_ENV, 'VSCODE_PATH=' + p + '\n'))"

      - name: Extension integration test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
